<section id="notifications">
  <h2>Zone de notifications</h2>
  <p>
    Vous avez {{notifList.length}} notifications.
  </p>

  <button type="button" (click)="ShowNotifications()">{{ btnText }}</button>
  @if (show) {
    <ul>
      @for (item of notifList; track item.id) {
        <li>{{ item.message }}</li>
      }
    </ul>
  }
</section>
